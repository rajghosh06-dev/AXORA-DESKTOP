[package]
name = "axora-desktop"
version = "1.0.0"
description = "Axora Desktop Application"
authors = ["Raj Ghosh"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6.0.0"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
image = "0.25"
aes-gcm = { version = "0.10", features = ["stream"] }
rand = "0.8"
rayon = "1.8"

# Phase 1: Argon2id for password-based key derivation
argon2 = "0.5"

# Phase 3: Network stack
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
mdns-sd = "0.11"
p256 = { version = "0.13", features = ["ecdh", "pkcs8"] }
base64 = "0.21"
uuid = { version = "1", features = ["v4"] }
local-ip-address = "0.6"
qrcode = "0.14"

# PDF manipulation
lopdf = "0.33"
printpdf = "0.7"
docx-rs = "0.4"
chrono = "0.4"

# Windows Runtime OCR + Media Foundation
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage_Streams",
  "Foundation",
  "Foundation_Collections",
] }

# Utility
once_cell = "1"
hostname = "0.3"
tokio-util = "0.7"
