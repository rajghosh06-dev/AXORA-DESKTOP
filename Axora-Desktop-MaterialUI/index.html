<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axora Desktop</title>
    <!--
      Critical: set background-color BEFORE any JS loads.
      This prevents any flash of unstyled/transparent content.
      Colors match MD3 surface tokens (light/dark auto-detected).
    -->
    <style>
      html, body, #root {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background-color: #f8fafd; /* MD3 light surface */
        overflow: hidden;
      }
      @media (prefers-color-scheme: dark) {
        html, body, #root { background-color: #111418; } /* MD3 dark surface */
      }
    </style>
    <!-- Google Fonts — preconnect for zero-latency font load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
